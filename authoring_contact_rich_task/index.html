<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authoring Contact-Rich Task</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #f5f5f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #111;
    }

    main {
      width: min(1100px, 100%);
    }

    video {
      display: block;
      width: 100%;
      max-height: calc(100vh - 48px);
      background: #000;
      border: 1px solid #333;
      border-radius: 8px;
    }

    a {
      color: #8dd0ff;
    }

    .fallback {
      margin: 12px 0 0;
      color: #cfd3dc;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <video controls playsinline preload="metadata">
      <source src="./authoring_contact_rich_task_pouring_1080p.mp4" type="video/mp4">
    </video>
    <p class="fallback">
      If the video does not load,
      <a href="./authoring_contact_rich_task_pouring_1080p.mp4">open the MP4 directly</a>.
    </p>
  </main>
</body>
</html>
